<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BZF E Quiz</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      display: flex;
    }
    #sidebar {
      width: 120px;
      background: #f2f2f2;
      height: 100vh;
      overflow-y: auto;
      padding: 10px;
      border-right: 1px solid #ccc;
    }
    #sidebar button {
      display: block;
      margin: 4px 0;
      padding: 5px;
      width: 100%;
      font-size: 14px;
    }
    #main {
      flex: 1;
      padding: 20px;
    }
    .question-box {
      margin-bottom: 20px;
    }
    .option {
      margin: 10px 0;
      display: block;
    }
    .nav-buttons {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
    }
    #submitButton {
      margin-top: 20px;
      display: block;
      padding: 10px 20px;
      font-size: 16px;
    }
    .result {
      font-size: 18px;
      margin-top: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="sidebar"></div>

  <div id="main">
    <h1>BZF E Practice Quiz</h1>
    <div id="errorBox" style="color:red; margin-bottom:10px;"></div>
    <label for="questionCount">Number of questions:</label>
    <select id="questionCount">
      <option value="5">5</option>
      <option value="10" selected>10</option>
      <option value="25">25</option>
      <option value="50">50</option>
    </select>
    <button onclick="startQuiz()">Start Quiz</button>

    <div id="quizArea" style="display:none;">
      <div id="questionBox" class="question-box"></div>
      <div class="nav-buttons">
        <button onclick="prevQuestion()">← Previous</button>
        <button onclick="nextQuestion()">Next →</button>
      </div>
      <button id="submitButton" onclick="submitQuiz()">Submit Quiz</button>
      <div id="result" class="result"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
